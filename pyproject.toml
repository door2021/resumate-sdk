[project]
name = "resumate-sdk"
version = "0.1.0"
description = "Checkpoint, repair, and resume your LangGraph agents with Resumate"
requires-python = ">=3.10"
dependencies = ["httpx>=0.28"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ledger = ["agent-ledger>=0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
